<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICA Maxi Östersund — Solenergi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@300;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a1f0e;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
  }

  .dash {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    min-height: 600px;
  }

  /* TOP BAR */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 36px;
    background: #0d2611;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .logo-block { display: flex; align-items: center; gap: 16px; }

  .ica-badge {
    background: #e2001a;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 1px;
    padding: 5px 16px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .site-name { font-size: 20px; font-weight: 600; color: #a3e4a3; }
  .site-sub  { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  .clock-block { text-align: right; }
  .clock-time  {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px; font-weight: 300;
    color: #fff; letter-spacing: 3px;
  }
  .clock-date { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    overflow: hidden;
  }

  .panel {
    padding: 24px 28px;
    border-right: 1px solid rgba(255,255,255,0.07);
    overflow: hidden;
  }
  .panel:last-child { border-right: none; }

  .panel-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* NUMBERS */
  .big-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(48px, 5vw, 72px);
    font-weight: 300;
    color: #6ed86e;
    line-height: 1;
  }
  .big-unit { font-size: 20px; color: rgba(110,216,110,0.55); margin-left: 4px; }

  .sub-row { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .sub-item { display: flex; flex-direction: column; gap: 3px; }
  .sub-label { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 1px; text-transform: uppercase; }
  .sub-val   { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 300; color: #fff; }
  .sub-val.green  { color: #6ed86e; }
  .sub-val.amber  { color: #f5b93e; }

  /* SPOT */
  .spot-block { margin-top: 24px; }
  .spot-row   { display: flex; align-items: baseline; gap: 6px; margin: 6px 0 4px; }
  .spot-num   { font-family: 'Barlow Condensed', sans-serif; font-size: 42px; font-weight: 300; color: #f5b93e; }
  .spot-unit  { font-size: 15px; color: rgba(245,185,62,0.55); }
  .spot-note  { font-size: 11px; color: rgba(255,255,255,0.25); }

  /* FLOW CENTER */
  .flow-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .flow-svg-wrap { width: 100%; max-width: 360px; }
  .flow-svg { width: 100%; height: 210px; }

  .node-label { font-family: 'Barlow', sans-serif; font-size: 9px; fill: rgba(255,255,255,0.45); text-anchor: middle; letter-spacing: 1.5px; text-transform: uppercase; }
  .node-val   { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; fill: #fff; text-anchor: middle; font-weight: 300; }

  /* BARS */
  .bars { width: 100%; margin-top: 16px; }
  .bar-row { margin-bottom: 12px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 5px; }
  .bar-track { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 1.2s ease; }
  .soc-bar  { background: #6ed86e; }
  .self-bar { background: #7ab8f5; }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 14px 12px;
  }
  .kpi-icon { font-size: 17px; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
  .kpi-val  { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(22px, 2.2vw, 30px); font-weight: 300; color: #fff; line-height: 1; }
  .kpi-unit { font-size: 12px; color: rgba(255,255,255,0.35); }
  .kpi-lbl  { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

  /* CHART */
  .chart-section { margin-top: 18px; flex: 1; }
  .chart-wrap { position: relative; width: 100%; height: 130px; margin-top: 8px; }

  /* BOTTOM BAR */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 36px;
    background: #0d2611;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 12px;
    color: rgba(255,255,255,0.28);
  }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6ed86e; display: inline-block;
    margin-right: 7px; vertical-align: middle;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }
</style>
</head>
<body>

<div class="dash">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo-block">
      <div class="ica-badge">ICA</div>
      <div>
        <div class="site-name">ICA Maxi Östersund</div>
        <div class="site-sub">Solenergi — realtidsöversikt</div>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock-time" id="clock">--:--</div>
      <div class="clock-date" id="dateline">–</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-grid">

    <!-- LEFT: Produktion + Spotpris -->
    <div class="panel">
      <div class="panel-label">Solproduktion just nu</div>
      <div>
        <span class="big-number" id="pv-now">–</span><span class="big-unit">kW</span>
      </div>
      <div class="sub-row">
        <div class="sub-item">
          <span class="sub-label">Idag</span>
          <span class="sub-val green" id="pv-today">–</span>
        </div>
        <div class="sub-item">
          <span class="sub-label">Denna månad</span>
          <span class="sub-val" id="pv-month">–</span>
        </div>
        <div class="sub-item">
          <span class="sub-label">Totalt</span>
          <span class="sub-val" id="pv-total">–</span>
        </div>
      </div>

      <div class="spot-block">
        <div class="panel-label">Spotpris SE2 just nu</div>
        <div class="spot-row">
          <span class="spot-num" id="spot-price">–</span>
          <span class="spot-unit">öre/kWh</span>
        </div>
        <div class="spot-note">Källa: Nordpool · uppdateras varje timme</div>
      </div>
    </div>

    <!-- CENTER: Energiflöde -->
    <div class="flow-center">
      <div class="panel-label">Energiflöde</div>
      <div class="flow-svg-wrap">
        <svg class="flow-svg" viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arr-g" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#6ed86e"/>
            </marker>
            <marker id="arr-b" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#7ab8f5"/>
            </marker>
            <marker id="arr-a" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#f5b93e"/>
            </marker>
          </defs>

          <!-- Sol -->
          <rect x="130" y="8" width="100" height="52" rx="10" fill="rgba(110,216,110,0.12)" stroke="#6ed86e" stroke-width="1.5"/>
          <text x="180" y="27" class="node-label">Solpaneler</text>
          <text x="180" y="50" class="node-val" id="flow-pv" style="fill:#6ed86e;">–</text>

          <!-- Butik -->
          <rect x="130" y="90" width="100" height="52" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
          <text x="180" y="109" class="node-label">Butiken</text>
          <text x="180" y="132" class="node-val" id="flow-load">–</text>

          <!-- Batteri -->
          <rect x="14" y="90" width="90" height="52" rx="10" fill="rgba(245,185,62,0.08)" stroke="#f5b93e" stroke-width="1.5"/>
          <text x="59" y="109" class="node-label" style="fill:rgba(245,185,62,0.6);">Batteri</text>
          <text x="59" y="132" class="node-val" id="flow-bat" style="fill:#f5b93e;">–</text>

          <!-- Elnät -->
          <rect x="256" y="90" width="90" height="52" rx="10" fill="rgba(122,184,245,0.08)" stroke="#7ab8f5" stroke-width="1.5"/>
          <text x="301" y="109" class="node-label" style="fill:rgba(122,184,245,0.6);">Elnätet</text>
          <text x="301" y="132" class="node-val" id="flow-grid" style="fill:#7ab8f5;">–</text>

          <!-- Sol → Butik -->
          <line x1="180" y1="60" x2="180" y2="90" stroke="#6ed86e" stroke-width="2" marker-end="url(#arr-g)"/>
          <!-- Sol → Batteri -->
          <line x1="130" y1="42" x2="104" y2="96" stroke="#f5b93e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-a)"/>
          <!-- Sol → Nät -->
          <line x1="230" y1="42" x2="256" y2="96" stroke="#7ab8f5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>

          <text x="180" y="195" class="node-label" id="flow-self" style="text-anchor:middle; font-size:10px;">Självförsörjning: –%</text>
        </svg>
      </div>

      <div class="bars" style="max-width:360px; width:100%;">
        <div class="bar-row">
          <div class="bar-top"><span>Batteri (SOC)</span><span id="soc-pct">–%</span></div>
          <div class="bar-track"><div class="bar-fill soc-bar" id="soc-bar" style="width:0%"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-top"><span>Självförsörjning idag</span><span id="self-pct">–%</span></div>
          <div class="bar-track"><div class="bar-fill self-bar" id="self-bar" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: KPI + Historik -->
    <div class="panel" style="display:flex; flex-direction:column;">
      <div class="panel-label">Dagens resultat</div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon"><i class="ti ti-coin" aria-hidden="true"></i></div>
          <div class="kpi-val" id="kpi-sek">–</div><div class="kpi-unit">kr</div>
          <div class="kpi-lbl">Intjänat idag</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon"><i class="ti ti-leaf" aria-hidden="true"></i></div>
          <div class="kpi-val" id="kpi-co2">–</div><div class="kpi-unit">kg CO₂</div>
          <div class="kpi-lbl">Besparing idag</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon"><i class="ti ti-calendar-stats" aria-hidden="true"></i></div>
          <div class="kpi-val" id="kpi-month-sek">–</div><div class="kpi-unit">kr</div>
          <div class="kpi-lbl">Denna månad</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon"><i class="ti ti-tree" aria-hidden="true"></i></div>
          <div class="kpi-val" id="kpi-trees">–</div><div class="kpi-unit">träd/år</div>
          <div class="kpi-lbl">CO₂-besparing totalt</div>
        </div>
      </div>

      <div class="chart-section">
        <div class="panel-label">Produktion senaste 7 dagarna (kWh)</div>
        <div class="chart-wrap">
          <canvas id="weekChart" role="img" aria-label="Stapeldiagram med solproduktion de senaste 7 dagarna">Laddar data...</canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <span><span class="status-dot"></span>Live · uppdateras var 5:e minut</span>
    <span id="last-updated">Hämtar data…</span>
    <span>Solenergi Norr · Sigenergy SigenStor</span>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ─── Klocka ─────────────────────────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('dateline').textContent =
    now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
}
tickClock();
setInterval(tickClock, 1000);

// ─── Chart ──────────────────────────────────────────────────────────────────
let weekChart = null;

function renderChart(labels, data) {
  const ctx = document.getElementById('weekChart').getContext('2d');
  if (weekChart) weekChart.destroy();
  weekChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: 'rgba(110,216,110,0.45)',
        borderColor: '#6ed86e',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 } },
          grid: { display: false }
        },
        y: {
          ticks: { color: 'rgba(255,255,255,0.3)', font: { size: 11 } },
          grid: { color: 'rgba(255,255,255,0.06)' }
        }
      }
    }
  });
}

// ─── Demo-data (används när SIGEN_APP_KEY inte är satt) ──────────────────────
function demoData() {
  const pv   = parseFloat((42.3 + (Math.random() - 0.5) * 6).toFixed(1));
  const load = parseFloat((35   + (Math.random() - 0.5) * 4).toFixed(1));
  const soc  = 78;
  const pvToday  = 186.4;
  const pvMonth  = 3240;
  const pvTotal  = 48320;
  const gridExp  = Math.max(0, pv - load);
  const selfUse  = Math.min(100, Math.round((pv / load) * 100));
  const days     = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
  const weekData = [145, 201, 178, 230, 195, 210, 186];
  return { pv, load, soc, pvToday, pvMonth, pvTotal, gridExp, gridImp: 0, selfUse, days, weekData };
}

// ─── Nordpool via elprisetjustnu.se (öppet API, ingen nyckel) ──────────────
async function fetchSpot() {
  try {
    const r = await fetch('https://www.elprisetjustnu.se/api/v1/prices/SE2.json');
    if (!r.ok) return null;
    const items = await r.json();
    const h = new Date().getHours();
    const match = items.find(i => new Date(i.time_start).getHours() === h);
    return match ? Math.round(match.SEK_per_kWh * 100) : null;
  } catch { return null; }
}

// ─── Sigenergy via Netlify Function (API-nycklar stannar server-side) ────────
async function fetchSigen(endpoint) {
  try {
    const r = await fetch(`/.netlify/functions/sigen?endpoint=${endpoint}`);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

// ─── Mappa Sigenergy-svar till intern modell ──────────────────────────────────
function mapSigen(raw) {
  const s = raw?.data || {};
  const pv   = (s.pvPower   || 0) / 1000;
  const load = (s.loadPower || 0) / 1000;
  const grid = (s.gridPower || 0) / 1000;
  return {
    pv, load,
    soc:      Math.round(s.batterySoc || 0),
    pvToday:  s.dailyPvEnergy   || 0,
    pvMonth:  s.monthlyPvEnergy || 0,
    pvTotal:  s.totalPvEnergy   || 0,
    gridExp:  Math.max(0, grid),
    gridImp:  Math.max(0, -grid),
    selfUse:  Math.round(s.selfConsumptionRate || 0),
    days:     ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'],
    weekData: s.weeklyData || [0,0,0,0,0,0,0]
  };
}

// ─── Applicera data på DOM ────────────────────────────────────────────────────
function apply(d, spotOre) {
  const f1 = v => parseFloat(v).toFixed(1);

  document.getElementById('pv-now').textContent   = f1(d.pv);
  document.getElementById('pv-today').textContent = f1(d.pvToday) + ' kWh';
  document.getElementById('pv-month').textContent = Math.round(d.pvMonth) + ' kWh';
  document.getElementById('pv-total').textContent = Math.round(d.pvTotal) + ' kWh';

  document.getElementById('flow-pv').textContent   = f1(d.pv) + ' kW';
  document.getElementById('flow-load').textContent = f1(d.load) + ' kW';
  document.getElementById('flow-bat').textContent  = d.soc + '%';
  document.getElementById('flow-grid').textContent =
    d.gridExp > 0.05 ? '+' + f1(d.gridExp) + ' kW' : f1(d.gridImp) + ' kW';
  document.getElementById('flow-self').textContent =
    'Självförsörjning: ' + d.selfUse + '%';

  document.getElementById('soc-pct').textContent  = d.soc + '%';
  document.getElementById('soc-bar').style.width  = d.soc + '%';
  document.getElementById('self-pct').textContent = d.selfUse + '%';
  document.getElementById('self-bar').style.width = d.selfUse + '%';

  if (spotOre) document.getElementById('spot-price').textContent = spotOre;

  const ore = spotOre || 62;
  const sekDay = Math.round(d.pvToday  * ore / 100);
  const sekMo  = Math.round(d.pvMonth  * ore / 100);
  const co2Day = Math.round(d.pvToday  * 0.42);
  const trees  = Math.round(d.pvTotal  * 0.42 / 22);

  document.getElementById('kpi-sek').textContent       = sekDay.toLocaleString('sv-SE');
  document.getElementById('kpi-co2').textContent       = co2Day;
  document.getElementById('kpi-month-sek').textContent = sekMo.toLocaleString('sv-SE');
  document.getElementById('kpi-trees').textContent     = trees;

  renderChart(d.days, d.weekData);

  document.getElementById('last-updated').textContent =
    'Senast uppdaterad: ' +
    new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
}

// ─── Huvud-poll ───────────────────────────────────────────────────────────────
async function refresh() {
  const [raw, spotOre] = await Promise.all([
    fetchSigen('realtime'),
    fetchSpot()
  ]);

  const d = (raw && !raw.demo) ? mapSigen(raw) : demoData();
  apply(d, spotOre);
}

refresh();
setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
